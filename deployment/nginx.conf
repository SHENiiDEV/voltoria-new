# Nginx Configuration for Voltoria AI (Ubuntu / Laravel 13)

server {
    listen 80;
    listen [::]:80;
    server_name voltoria.ai www.voltoria.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name voltoria.ai www.voltoria.ai;

    root /var/www/voltoria-new/public;
    index index.php index.html;

    # SSL Certificates (Certbot / Cloudflare Origin)
    ssl_certificate /etc/letsencrypt/live/voltoria.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voltoria.ai/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    # Increase upload and execution limits for AI generations
    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Increased timeouts for DeepSeek API synchronous fallback (up to 3 minutes)
        fastcgi_read_timeout 180;
        fastcgi_connect_timeout 180;
        fastcgi_send_timeout 180;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
