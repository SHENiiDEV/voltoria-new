server {
    server_name voltoria.co.uk www.voltoria.co.uk;
    include snippets/wp-protect.conf;

    root /var/www/customAI/voltoria/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    client_max_body_size 50M;

    location / {
        if ($is_bad_client = 1) { return 444; }
        if ($is_bad_query = 1) { return 444; }
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Increased timeouts for AI architectural generation
        fastcgi_read_timeout 180;
        fastcgi_connect_timeout 180;
        fastcgi_send_timeout 180;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/voltoria.co.uk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/voltoria.co.uk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.voltoria.co.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = voltoria.co.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;

    server_name voltoria.co.uk www.voltoria.co.uk;
    include snippets/wp-protect.conf;
    return 404; # managed by Certbot
}
